# Проверки на каждый пуш.
#
# Раннер windows: окно проверяется без экрана (Qt offscreen), а тексту на кадрах нужны
# шрифты - offscreen берёт их из папки шрифтов Windows (offscreen.py). На linux их нет,
# и проверки кадров начали бы падать не из-за кода.
#
# Числа потоков BLAS - как у обучения: тесты гоняют обученные сети, и четырёх хватает.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Проверки
    runs-on: windows-latest
    # 2.0: 627 тестов, законы обучения и сеансы на 30 минут жизни - полный прогон на ПК 1.5-2 часа
    # (в 1.1.0 было 9 минут, и 20 минут 2.0 обрывали на 22 %).
    timeout-minutes: 180
    env:
      OPENBLAS_NUM_THREADS: "4"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        run: python -m pytest -q

      - name: Самопроверка без экрана
        run: |
          python main.py --selftest selftest.txt
          Get-Content selftest.txt
